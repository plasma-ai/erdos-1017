        and papers fetched from the web, and ran Python checks of linear
        programs and exact rational certificates, without Lean.
      prompting_notes: >-
        The research asked for an answer to Erdős Problem 1017. GPT-6.1 Sol
        and GPT-6 Astra in Codex contributed to it, alongside Claude Opus 5.5
        in Claude Code.
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Research sessions with shell access in the same research workspace
        as the Codex runs.
      prompting_notes: >-
        Claude Opus 5.5 in Claude Code contributed to the same research,
        alongside GPT-6.1 Sol and GPT-6 Astra in Codex.
    - method: "agent"
      models: ["gpt-6.1-sol", "gpt-6-astra"]
      framework: "Codex"
      tool_setup: "Lean 4.35.0-rc4, Mathlib, Lake, and Python."
      prompting_notes: >-
        Asked to prove the problem's statement in Lean as one uniform theorem
        with no hypotheses. GPT-6.1 Sol and GPT-6 Astra in Codex contributed
        to the formalization under human direction, alongside Claude Opus 5.5
        in Claude Code.
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: "Lean 4.35.0-rc4, Mathlib, Lake, and Python."
      prompting_notes: >-
        Claude Opus 5.5 in Claude Code contributed to the formalization under
        human direction, alongside GPT-6.1 Sol and GPT-6 Astra in Codex.
  notes: >-
    GPT-6.1 Sol and GPT-6 Astra in Codex and Claude Opus 5.5 in Claude Code
    found the proof: the benchmark B with its split, mixed and two-head
    families and their dual certificates, and the argument for the upper
    bound, namely limit models at a positive maximum of F − B, their
    structure, and a case analysis of the possible locations of the maximum.
    The same models produced the Lean formalization in Codex and Claude Code
    under human direction.

fidelity:
  divergences: >-
    Erdős asked whether the Erdős–Goodman–Pósa bound can be sharpened for
    k > n²/4, and Bloom's catalog asks for an estimate of f(n, k) there. The
    compared theorem makes this precise as a uniform additive asymptotic,
    f(n, k) = n² B(k/n²) + o(n²) over all 0 ≤ k ≤ n(n − 1)/2, with densities
    normalized by n² rather than by n(n − 1)/2. f is formal-conjectures'
    definition: the least m such that every graph on Fin n with exactly k
    edges has a partition of its edges into at most m cliques with at least
    two vertices each. For k ≤ n(n − 1)/2 this is the largest clique partition
    number among such graphs; for larger k it is 0, and the theorem does not
    use those values. In Challenge.lean the roots σ_d and z_c and the inverses
    of the mixed and two-head families are defined as infima of their exact
    algebraic solution sets in the stated intervals; the development proves
    that these are the unique roots and inverses and that B is continuous on
    [0, 1/2]. The blueprint follows the route of the Lean proof.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The human project lead checked the statement in Challenge.lean against the
    problem and confirmed that it formalizes the claimed result. The full
    development, including the vendored graphon library, builds on Lean
    v4.35.0-rc4, and the compared theorem depends only on propext,
    Classical.choice, and Quot.sound. Comparator, from the toolchain's lake
    comparator, accepts it at commit cba465c7c5ffca9a5c881e23c54ab4dbb43a5bab
    against Challenge.lean with the Lean, NanoDa and con-ron kernels. It ran
    in its bwrap sandbox on Linux, under Docker Desktop on an Apple silicon
    Mac, with Docker's /proc masking relaxed (--unmask-proc) so that bwrap
    could mount /proc. Plasma AI has reviewed the proof internally. No
    independent review of the formalization has been recorded.

alignment:
  namespace: "Erdos1017"
  statements:
    - source: "Erdős Problem 1017, as a uniform asymptotic formula"
      lean: "Erdos1017.uniform_asymptotic"
      module: "Solution"
      status: "proved"
      note: >-
        For every ε > 0 there is N such that
        |f n k / n² − benchmark (k / n²)| < ε for all n ≥ N and all
        k ≤ n.choose 2, where f is formal-conjectures' f and benchmark is the
        function B defined in Challenge.lean.

acknowledgements: "Mathlib, formal-conjectures, Cameron Freer's graphon, and the authors of the cited mathematical sources."
